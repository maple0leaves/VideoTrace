spring.application.name=vidotrace-server
server.port=${SERVER_PORT:9090}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

# Bounded executors for a small production host.
app.executor.ai.core-size=${AI_EXECUTOR_CORE_SIZE:2}
app.executor.ai.max-size=${AI_EXECUTOR_MAX_SIZE:4}
app.executor.ai.queue-capacity=${AI_EXECUTOR_QUEUE_CAPACITY:50}
app.executor.analysis.workers=${ANALYSIS_WORKERS:2}
app.executor.context.core-size=${CONTEXT_EXECUTOR_CORE_SIZE:4}
app.executor.context.max-size=${CONTEXT_EXECUTOR_MAX_SIZE:4}
app.executor.context.queue-capacity=${CONTEXT_EXECUTOR_QUEUE_CAPACITY:4}
app.executor.asr.core-size=${ASR_EXECUTOR_CORE_SIZE:2}
app.executor.asr.max-size=${ASR_EXECUTOR_MAX_SIZE:2}
app.executor.asr.queue-capacity=${ASR_EXECUTOR_QUEUE_CAPACITY:16}
app.executor.ocr.core-size=${OCR_EXECUTOR_CORE_SIZE:2}
app.executor.ocr.max-size=${OCR_EXECUTOR_MAX_SIZE:2}
app.executor.ocr.queue-capacity=${OCR_EXECUTOR_QUEUE_CAPACITY:8}

# End-to-end analysis deadline and bounded media work.
analysis.task.max-duration-ms=${ANALYSIS_TASK_MAX_DURATION_MS:480000}
video.context.timeout-seconds=${VIDEO_CONTEXT_TIMEOUT_SECONDS:300}
video.asr.segment-parallelism=${ASR_SEGMENT_PARALLELISM:2}
video.ocr.frame-parallelism=${OCR_FRAME_PARALLELISM:2}
video.ocr.max-key-frames=${OCR_MAX_KEY_FRAMES:20}
video.ffmpeg.max-concurrent=${FFMPEG_MAX_CONCURRENT:2}

# Database
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/media_db?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf-8&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=3000
spring.sql.init.mode=always
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.slf4j.Slf4jImpl

# Upload
spring.servlet.multipart.max-file-size=2048MB
spring.servlet.multipart.max-request-size=2048MB

# Shared default media attached to every user account.
app.default-media.enabled=${DEFAULT_MEDIA_ENABLED:true}
app.default-media.file-path=${DEFAULT_MEDIA_FILE_PATH:default-media/experiment-one.mp4}
app.default-media.filename=${DEFAULT_MEDIA_FILENAME:\u5B9E\u9A8C\u4E00\u8BB2\u89E3\u89C6\u9891.mp4}
app.default-media.system-key=${DEFAULT_MEDIA_SYSTEM_KEY:experiment-one-tutorial}
app.default-media.object-prefix=${DEFAULT_MEDIA_OBJECT_PREFIX:system-defaults}
app.default-media.backfill-existing-users=${DEFAULT_MEDIA_BACKFILL_EXISTING_USERS:true}

# Chat model: DeepSeek official first, SiliconFlow fallback.
ai.chat.primary.api-key=${DEEPSEEK_API_KEY}
ai.chat.primary.base-url=${DEEPSEEK_BASE_URL:https://api.deepseek.com}
ai.chat.primary.model=${DEEPSEEK_MODEL:deepseek-v4-flash}
ai.chat.primary.input-price-per-million=${DEEPSEEK_INPUT_PRICE_PER_MILLION:0}
ai.chat.primary.output-price-per-million=${DEEPSEEK_OUTPUT_PRICE_PER_MILLION:0}
ai.chat.fallback.api-key=${SILICONFLOW_API_KEY}
ai.chat.fallback.base-url=${SILICONFLOW_BASE_URL:https://api.siliconflow.cn/v1}
ai.chat.fallback.model=${SILICONFLOW_LLM_MODEL:deepseek-ai/DeepSeek-V4-Flash}
ai.chat.fallback.input-price-per-million=${SILICONFLOW_LLM_INPUT_PRICE_PER_MILLION:0}
ai.chat.fallback.output-price-per-million=${SILICONFLOW_LLM_OUTPUT_PRICE_PER_MILLION:0}
ai.chat.timeout-seconds=${LLM_REQUEST_TIMEOUT_SECONDS:30}

# SiliconFlow continues to provide Embedding and ASR.
ai.siliconflow.api-key=${SILICONFLOW_API_KEY}
ai.siliconflow.base-url=${SILICONFLOW_BASE_URL:https://api.siliconflow.cn/v1}
ai.embedding.model=${EMBEDDING_MODEL:BAAI/bge-m3}
ai.asr.url=${ASR_URL:https://api.siliconflow.cn/v1/audio/transcriptions}
ai.asr.model=${ASR_MODEL:TeleAI/TeleSpeechASR}
ai.asr.timeout-seconds=${ASR_REQUEST_TIMEOUT_SECONDS:60}
ai.asr.max-attempts=${ASR_MAX_ATTEMPTS:2}

# Agent termination budget
agent.budget.max-rounds=${AGENT_MAX_ROUNDS:2}
agent.budget.max-duration-ms=${AGENT_MAX_DURATION_MS:120000}
agent.budget.max-estimated-tokens=${AGENT_MAX_ESTIMATED_TOKENS:50000}
agent.budget.max-estimated-cost=${AGENT_MAX_ESTIMATED_COST:1}
agent.evaluation.enabled=${AGENT_EVALUATION_ENABLED:false}

# Vector store (separate PostgreSQL DataSource; business data remains in MySQL)
vector.pg.enabled=${VECTOR_DB_ENABLED:true}
vector.pg.url=${VECTOR_DB_URL:jdbc:postgresql://localhost:5433/vidotrace_vectors}
vector.pg.username=${VECTOR_DB_USERNAME:vidotrace}
vector.pg.password=${VECTOR_DB_PASSWORD:vidotrace}
vector.pg.dimension=${VECTOR_DIMENSION:1024}
vector.pg.table=${VECTOR_TABLE:video_chunk_vectors}
vector.pg.pool.maximum-size=${VECTOR_DB_POOL_MAX_SIZE:4}
vector.pg.pool.minimum-idle=${VECTOR_DB_POOL_MIN_IDLE:1}

# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.database=${REDIS_DATABASE:0}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=3000ms
auth.captcha.expires-seconds=${CAPTCHA_EXPIRES_SECONDS:180}

# MinIO
minio.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
minio.accessKey=${MINIO_ACCESS_KEY}
minio.secretKey=${MINIO_SECRET_KEY}
minio.bucketName=${MINIO_BUCKET:media}
minio.public-read=${MINIO_PUBLIC_READ:false}
minio.playback-proxy-prefix=${MINIO_PLAYBACK_PROXY_PREFIX:}

# Local media tools
tool.ytdlp.path=${YTDLP_PATH:yt-dlp}
tool.ffmpeg.dir=${FFMPEG_DIR:}
tool.ocr.command=${OCR_COMMAND:tesseract}
tool.ocr.timeout-seconds=${OCR_TIMEOUT_SECONDS:30}

# RocketMQ
rocketmq.name-server=${ROCKETMQ_NAME_SERVER:127.0.0.1:9876}
rocketmq.producer.group=${ROCKETMQ_PRODUCER_GROUP:video-analysis-producer}
rocketmq.producer.send-message-timeout=3000
rocketmq.topic.video-analysis=${ROCKETMQ_ANALYSIS_TOPIC:video-analysis-topic}
rocketmq.topic.video-analysis-dead=${ROCKETMQ_ANALYSIS_DEAD_TOPIC:video-analysis-dead-topic}
rocketmq.consumer.group=${ROCKETMQ_ANALYSIS_GROUP:video-analysis-consumer}
