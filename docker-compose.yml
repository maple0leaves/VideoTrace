name: vidotrace

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  mysql:
    image: mysql:8.0.42
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: media_db
      MYSQL_USER: ${DB_USERNAME:-vidotrace}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=1G
      - --max-connections=100
    volumes:
      - ${VIDEOTRACE_DATA_DIR:-/data/vidotrace}/mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    cpus: "1.0"
    mem_limit: 2g
    logging: *default-logging

  redis:
    image: redis:7.4.5-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$${REDIS_PASSWORD}\""]
    volumes:
      - ${VIDEOTRACE_DATA_DIR:-/data/vidotrace}/redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    cpus: "0.5"
    mem_limit: 512m
    logging: *default-logging

  pgvector:
    image: pgvector/pgvector:0.8.0-pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: vidotrace_vectors
      POSTGRES_USER: vidotrace
      POSTGRES_PASSWORD: ${VECTOR_DB_PASSWORD:-vidotrace}
    volumes:
      - ${VIDEOTRACE_DATA_DIR:-/data/vidotrace}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vidotrace -d vidotrace_vectors"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    cpus: "1.0"
    mem_limit: 2g
    logging: *default-logging

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
    command: server /data --console-address ":9001"
    volumes:
      - ${VIDEOTRACE_DATA_DIR:-/data/vidotrace}/minio:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    cpus: "0.5"
    mem_limit: 1g
    logging: *default-logging

  rmqnamesrv:
    image: apache/rocketmq:5.3.2
    restart: unless-stopped
    environment:
      JAVA_OPT_EXT: -server -Xms256m -Xmx256m -Xmn128m
    command: sh mqnamesrv
    volumes:
      - ${VIDEOTRACE_DATA_DIR:-/data/vidotrace}/rocketmq/namesrv-logs:/home/rocketmq/logs
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/9876'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    cpus: "0.5"
    mem_limit: 512m
    logging: *default-logging

  rmqbroker:
    image: apache/rocketmq:5.3.2
    restart: unless-stopped
    environment:
      NAMESRV_ADDR: rmqnamesrv:9876
      JAVA_OPT_EXT: -server -Xms512m -Xmx512m -Xmn256m
    command: sh mqbroker -n rmqnamesrv:9876 -c /home/rocketmq/rocketmq-5.3.2/conf/broker.conf
    volumes:
      - ./rocketmq/broker.conf:/home/rocketmq/rocketmq-5.3.2/conf/broker.conf:ro
      - ${VIDEOTRACE_DATA_DIR:-/data/vidotrace}/rocketmq/broker-logs:/home/rocketmq/logs
      - ${VIDEOTRACE_DATA_DIR:-/data/vidotrace}/rocketmq/store:/home/rocketmq/store
    depends_on:
      rmqnamesrv:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/10911'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    cpus: "0.75"
    mem_limit: 1g
    logging: *default-logging

  server:
    build:
      context: ./server
      args:
        DOCKER_HUB_PROXY: ${DOCKER_HUB_PROXY:-m.daocloud.io/docker.io/library}
        UBUNTU_MIRROR: ${UBUNTU_MIRROR:-https://repo.huaweicloud.com/ubuntu}
        PYPI_INDEX_URL: ${PYPI_INDEX_URL:-https://repo.huaweicloud.com/repository/pypi/simple}
    restart: unless-stopped
    environment:
      SERVER_PORT: "9090"
      JAVA_TOOL_OPTIONS: -Xms512m -Xmx2g -XX:+ExitOnOutOfMemoryError -Djava.io.tmpdir=/tmp/vidotrace
      DB_URL: jdbc:mysql://mysql:3306/media_db?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf-8&allowPublicKeyRetrieval=true
      DB_USERNAME: ${DB_USERNAME:-vidotrace}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_POOL_MAX_SIZE: "10"
      DB_POOL_MIN_IDLE: "2"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      MINIO_ENDPOINT: ${MINIO_INTERNAL_ENDPOINT:-http://minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET:-media}
      MINIO_PUBLIC_READ: "false"
      MINIO_PLAYBACK_PROXY_PREFIX: ${MINIO_PLAYBACK_PROXY_PREFIX:-/media-storage}
      VECTOR_DB_ENABLED: "true"
      VECTOR_DB_URL: jdbc:postgresql://pgvector:5432/vidotrace_vectors
      VECTOR_DB_USERNAME: vidotrace
      VECTOR_DB_PASSWORD: ${VECTOR_DB_PASSWORD:-vidotrace}
      VECTOR_DIMENSION: ${VECTOR_DIMENSION:-1024}
      VECTOR_TABLE: ${VECTOR_TABLE:-video_chunk_vectors}
      VECTOR_DB_POOL_MAX_SIZE: ${VECTOR_DB_POOL_MAX_SIZE:-4}
      VECTOR_DB_POOL_MIN_IDLE: ${VECTOR_DB_POOL_MIN_IDLE:-1}
      ROCKETMQ_NAME_SERVER: rmqnamesrv:9876
      ROCKETMQ_PRODUCER_GROUP: video-analysis-producer
      ROCKETMQ_ANALYSIS_GROUP: video-analysis-consumer
      DEEPSEEK_API_KEY: ${VIDEOTRACE_DEEPSEEK_API_KEY:?VIDEOTRACE_DEEPSEEK_API_KEY is required}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-flash}
      SILICONFLOW_API_KEY: ${SILICONFLOW_API_KEY:?SILICONFLOW_API_KEY is required}
      SILICONFLOW_BASE_URL: ${SILICONFLOW_BASE_URL:-https://api.siliconflow.cn/v1}
      SILICONFLOW_LLM_MODEL: ${SILICONFLOW_LLM_MODEL:-deepseek-ai/DeepSeek-V4-Flash}
      LLM_REQUEST_TIMEOUT_SECONDS: ${LLM_REQUEST_TIMEOUT_SECONDS:-30}
      AGENT_MAX_DURATION_MS: ${AGENT_MAX_DURATION_MS:-120000}
      ANALYSIS_TASK_MAX_DURATION_MS: ${ANALYSIS_TASK_MAX_DURATION_MS:-480000}
      VIDEO_CONTEXT_TIMEOUT_SECONDS: ${VIDEO_CONTEXT_TIMEOUT_SECONDS:-300}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-m3}
      ASR_MODEL: ${ASR_MODEL:-TeleAI/TeleSpeechASR}
      ASR_REQUEST_TIMEOUT_SECONDS: ${ASR_REQUEST_TIMEOUT_SECONDS:-60}
      ASR_MAX_ATTEMPTS: ${ASR_MAX_ATTEMPTS:-2}
      ASR_SEGMENT_PARALLELISM: ${ASR_SEGMENT_PARALLELISM:-2}
      OCR_TIMEOUT_SECONDS: ${OCR_TIMEOUT_SECONDS:-30}
      OCR_FRAME_PARALLELISM: ${OCR_FRAME_PARALLELISM:-2}
      OCR_MAX_KEY_FRAMES: ${OCR_MAX_KEY_FRAMES:-20}
      FFMPEG_MAX_CONCURRENT: ${FFMPEG_MAX_CONCURRENT:-2}
      CORS_ALLOWED_ORIGINS: ${PUBLIC_ORIGIN:?PUBLIC_ORIGIN is required}
      YTDLP_PATH: yt-dlp
      FFMPEG_DIR: ""
      OCR_COMMAND: tesseract
      OMP_THREAD_LIMIT: "1"
      OMP_NUM_THREADS: "1"
      AI_EXECUTOR_CORE_SIZE: "2"
      AI_EXECUTOR_MAX_SIZE: "4"
      AI_EXECUTOR_QUEUE_CAPACITY: "50"
      ANALYSIS_WORKERS: "2"
      CONTEXT_EXECUTOR_CORE_SIZE: "4"
      CONTEXT_EXECUTOR_MAX_SIZE: "4"
      CONTEXT_EXECUTOR_QUEUE_CAPACITY: "4"
      ASR_EXECUTOR_CORE_SIZE: "2"
      ASR_EXECUTOR_MAX_SIZE: "2"
      ASR_EXECUTOR_QUEUE_CAPACITY: "16"
      OCR_EXECUTOR_CORE_SIZE: "2"
      OCR_EXECUTOR_MAX_SIZE: "2"
      OCR_EXECUTOR_QUEUE_CAPACITY: "8"
    volumes:
      - ${VIDEOTRACE_DATA_DIR:-/data/vidotrace}/tmp:/tmp/vidotrace
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      pgvector:
        condition: service_healthy
      minio:
        condition: service_healthy
      rmqbroker:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9090/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 90s
    cpus: "2.0"
    mem_limit: 3g
    logging: *default-logging

  client:
    build:
      context: ./client
      args:
        DOCKER_HUB_PROXY: ${DOCKER_HUB_PROXY:-m.daocloud.io/docker.io/library}
        VITE_API_BASE_URL: /api
        NPM_REGISTRY: ${NPM_REGISTRY:-https://repo.huaweicloud.com/repository/npm/}
    restart: unless-stopped
    ports:
      - "${HTTP_BIND_ADDRESS:-0.0.0.0}:${HTTP_PORT:-80}:80"
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ > /dev/null"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    cpus: "0.25"
    mem_limit: 256m
    logging: *default-logging
