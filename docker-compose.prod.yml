name: vidotrace-production

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

x-production-service: &production-service
  restart: unless-stopped
  logging: *default-logging

services:
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    <<: *production-service
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
    command: server /data --console-address ":9001"
    volumes:
      - ${VIDEOTRACE_DATA_DIR:?VIDEOTRACE_DATA_DIR is required}/minio:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    cpus: "0.5"
    mem_limit: 1g

  server-tmp-init:
    image: busybox:1.36.1
    restart: "no"
    user: "0:0"
    command: sh -c "chown -R 10001:10001 /tmp/vidotrace && chmod 700 /tmp/vidotrace"
    volumes:
      - ${VIDEOTRACE_DATA_DIR:?VIDEOTRACE_DATA_DIR is required}/tmp:/tmp/vidotrace

  server:
    build:
      context: ./server
      args:
        DOCKER_HUB_PROXY: ${DOCKER_HUB_PROXY:-m.daocloud.io/docker.io/library}
        UBUNTU_MIRROR: ${UBUNTU_MIRROR:-https://repo.huaweicloud.com/ubuntu}
        PYPI_INDEX_URL: ${PYPI_INDEX_URL:-https://repo.huaweicloud.com/repository/pypi/simple}
    <<: *production-service
    environment:
      SERVER_PORT: "9090"
      JAVA_TOOL_OPTIONS: -Xms512m -Xmx2g -XX:+ExitOnOutOfMemoryError -Djava.io.tmpdir=/tmp/vidotrace
      DB_URL: ${DB_URL:-jdbc:mysql://shared-mysql:3306/media_db?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf-8&allowPublicKeyRetrieval=true}
      DB_USERNAME: ${DB_USERNAME:-vidotrace_app}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      DB_POOL_MAX_SIZE: ${DB_POOL_MAX_SIZE:-10}
      DB_POOL_MIN_IDLE: ${DB_POOL_MIN_IDLE:-2}
      REDIS_HOST: ${REDIS_HOST:-shared-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      REDIS_DATABASE: ${REDIS_DATABASE:-0}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
      MINIO_BUCKET: ${MINIO_BUCKET:-media}
      MINIO_PUBLIC_READ: "false"
      MINIO_PLAYBACK_PROXY_PREFIX: ${MINIO_PLAYBACK_PROXY_PREFIX:-/media-storage}
      VECTOR_DB_ENABLED: "true"
      VECTOR_DB_URL: ${VECTOR_DB_URL:-jdbc:postgresql://shared-pgvector:5432/vidotrace_vectors}
      VECTOR_DB_USERNAME: ${VECTOR_DB_USERNAME:-vidotrace_vector}
      VECTOR_DB_PASSWORD: ${VECTOR_DB_PASSWORD:?VECTOR_DB_PASSWORD is required}
      VECTOR_DIMENSION: ${VECTOR_DIMENSION:-1024}
      VECTOR_TABLE: ${VECTOR_TABLE:-video_chunk_vectors}
      VECTOR_DB_POOL_MAX_SIZE: ${VECTOR_DB_POOL_MAX_SIZE:-4}
      VECTOR_DB_POOL_MIN_IDLE: ${VECTOR_DB_POOL_MIN_IDLE:-1}
      ROCKETMQ_NAME_SERVER: ${ROCKETMQ_NAME_SERVER:-shared-rocketmq-namesrv:9876}
      ROCKETMQ_PRODUCER_GROUP: ${ROCKETMQ_PRODUCER_GROUP:-video-analysis-producer}
      ROCKETMQ_ANALYSIS_GROUP: ${ROCKETMQ_ANALYSIS_GROUP:-video-analysis-consumer}
      ROCKETMQ_ANALYSIS_TOPIC: ${ROCKETMQ_ANALYSIS_TOPIC:-video-analysis-topic}
      ROCKETMQ_ANALYSIS_DEAD_TOPIC: ${ROCKETMQ_ANALYSIS_DEAD_TOPIC:-video-analysis-dead-topic}
      DEEPSEEK_API_KEY: ${VIDEOTRACE_DEEPSEEK_API_KEY:?VIDEOTRACE_DEEPSEEK_API_KEY is required}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-flash}
      SILICONFLOW_API_KEY: ${SILICONFLOW_API_KEY:?SILICONFLOW_API_KEY is required}
      SILICONFLOW_BASE_URL: ${SILICONFLOW_BASE_URL:-https://api.siliconflow.cn/v1}
      SILICONFLOW_LLM_MODEL: ${SILICONFLOW_LLM_MODEL:-deepseek-ai/DeepSeek-V4-Flash}
      LLM_REQUEST_TIMEOUT_SECONDS: ${LLM_REQUEST_TIMEOUT_SECONDS:-30}
      AGENT_MAX_DURATION_MS: ${AGENT_MAX_DURATION_MS:-120000}
      ANALYSIS_TASK_MAX_DURATION_MS: ${ANALYSIS_TASK_MAX_DURATION_MS:-480000}
      VIDEO_CONTEXT_TIMEOUT_SECONDS: ${VIDEO_CONTEXT_TIMEOUT_SECONDS:-300}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-m3}
      ASR_MODEL: ${ASR_MODEL:-TeleAI/TeleSpeechASR}
      ASR_REQUEST_TIMEOUT_SECONDS: ${ASR_REQUEST_TIMEOUT_SECONDS:-60}
      ASR_MAX_ATTEMPTS: ${ASR_MAX_ATTEMPTS:-2}
      ASR_SEGMENT_PARALLELISM: ${ASR_SEGMENT_PARALLELISM:-1}
      OCR_TIMEOUT_SECONDS: ${OCR_TIMEOUT_SECONDS:-30}
      OCR_FRAME_PARALLELISM: ${OCR_FRAME_PARALLELISM:-1}
      OCR_MAX_KEY_FRAMES: ${OCR_MAX_KEY_FRAMES:-20}
      FFMPEG_MAX_CONCURRENT: ${FFMPEG_MAX_CONCURRENT:-1}
      CORS_ALLOWED_ORIGINS: ${PUBLIC_ORIGIN:?PUBLIC_ORIGIN is required}
      YTDLP_PATH: yt-dlp
      FFMPEG_DIR: ""
      OCR_COMMAND: tesseract
      OMP_THREAD_LIMIT: "1"
      OMP_NUM_THREADS: "1"
      AI_EXECUTOR_CORE_SIZE: ${AI_EXECUTOR_CORE_SIZE:-2}
      AI_EXECUTOR_MAX_SIZE: ${AI_EXECUTOR_MAX_SIZE:-4}
      AI_EXECUTOR_QUEUE_CAPACITY: ${AI_EXECUTOR_QUEUE_CAPACITY:-50}
      ANALYSIS_WORKERS: ${ANALYSIS_WORKERS:-1}
      CONTEXT_EXECUTOR_CORE_SIZE: ${CONTEXT_EXECUTOR_CORE_SIZE:-2}
      CONTEXT_EXECUTOR_MAX_SIZE: ${CONTEXT_EXECUTOR_MAX_SIZE:-2}
      CONTEXT_EXECUTOR_QUEUE_CAPACITY: ${CONTEXT_EXECUTOR_QUEUE_CAPACITY:-4}
      ASR_EXECUTOR_CORE_SIZE: ${ASR_EXECUTOR_CORE_SIZE:-1}
      ASR_EXECUTOR_MAX_SIZE: ${ASR_EXECUTOR_MAX_SIZE:-1}
      ASR_EXECUTOR_QUEUE_CAPACITY: ${ASR_EXECUTOR_QUEUE_CAPACITY:-16}
      OCR_EXECUTOR_CORE_SIZE: ${OCR_EXECUTOR_CORE_SIZE:-1}
      OCR_EXECUTOR_MAX_SIZE: ${OCR_EXECUTOR_MAX_SIZE:-1}
      OCR_EXECUTOR_QUEUE_CAPACITY: ${OCR_EXECUTOR_QUEUE_CAPACITY:-8}
    volumes:
      - ${VIDEOTRACE_DATA_DIR:?VIDEOTRACE_DATA_DIR is required}/tmp:/tmp/vidotrace
    depends_on:
      minio:
        condition: service_healthy
      server-tmp-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9090/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 90s
    cpus: "2.0"
    mem_limit: 3g
    networks:
      - default
      - shared-platform

  client:
    build:
      context: ./client
      args:
        DOCKER_HUB_PROXY: ${DOCKER_HUB_PROXY:-m.daocloud.io/docker.io/library}
        VITE_API_BASE_URL: /api
        NPM_REGISTRY: ${NPM_REGISTRY:-https://repo.huaweicloud.com/repository/npm/}
    <<: *production-service
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ > /dev/null"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    cpus: "0.25"
    mem_limit: 256m
    networks:
      default:
      shared-platform:
        aliases:
          - vidotrace-client

networks:
  default:
    name: vidotrace-production
  shared-platform:
    external: true
    name: ${SHARED_NETWORK:-shared-platform}
